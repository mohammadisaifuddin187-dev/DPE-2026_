# KI-Kennzeichnung: mit KI-Unterstützung erstellt (Claude, Anthropic), von Erion geprüft.
# Zugangsdaten nur über Umgebungsvariablen, nie im Repo.

quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/team2}
quarkus.datasource.username=${DB_USER:team2}
quarkus.datasource.password=${DB_PASSWORD:}

# Hibernate legt fehlende Tabellen an bzw. ergänzt sie (Tabellennamen wie in testdaten/team2/T2_Testdaten.sql)
quarkus.hibernate-orm.database.generation=update

# Keine Dev Services: Wir nutzen die eigene MySQL-Datenbank (Docker), nicht einen automatisch gestarteten Container
quarkus.devservices.enabled=false

# REST-API der Engine (CIB seven)
team2.engine.rest-url=${ENGINE_REST_URL:http://localhost:8080/engine-rest}

# Eigener Port, damit er nicht mit CIB seven (8080) und den Workern (8091, 8092) kollidiert
quarkus.http.port=8093
